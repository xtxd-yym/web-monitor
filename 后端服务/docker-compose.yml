version: '3.8'

# 仅供人工开发联调；生产使用容器平台管理的数据库与 Secret。
services:
  monitor-backend:
    build: .
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=development
      - DB_TYPE=mysql
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:?请通过环境变量提供数据库密码}
      - DB_NAME=monitor_system
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:?请通过环境变量提供管理员密码}
      - JWT_SECRET=${JWT_SECRET:?请通过环境变量提供签名密钥}
      - FUYAO_VANISH_ALERT_URL=${FUYAO_VANISH_ALERT_URL:-}
      - VANISH_AK=${VANISH_AK:-}
    depends_on:
      - mysql-db
    volumes:
      - ./:/app
      - /app/node_modules

  mysql-db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请通过环境变量提供数据库密码}
      MYSQL_DATABASE: monitor_system
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
